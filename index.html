/* ---- 目录渲染（自定义目录优先合并显示；书内目录按 depth 组成树，父项可展开/折叠） ---- */
let tocCollapsed=new Set();   /* 被收起的书内目录项下标（按 builtin 数组下标存，换书时清空） */
/* ---- 第十四批：目录「当前章节」高亮 ----
   renderToc 每次都重建 innerHTML，所以高亮**不靠重绘**：tocMarkCur() 单独切 `.cur` class，
   免得把折叠态与面板滚动位置一起打乱（这也是不改 renderToc 主流程的原因）。
   匹配信号按各档实际情况分开：
     · EPUB 有 spine href ⇒ 按 href 比（先整串、再退化到文件名，与 epubTitleFromHref 同法）
     · TXT 有 cur._ch（当前章下标）⇒ 按 ch 比
     · PDF / CBZ 的目录项目标是页码 ⇒ 取「≤ 当前页的最后一个」 */
let tocItemsCache=[];   /* 与 #tocList 里 data-b 下标一一对应的位置信号表 */
let tocCurIdx=-1;       /* 当前高亮项，-1 = 无 */
let tocCacheBookId='';
function tocMarkCur(i){
  if(i===tocCurIdx) return;
  tocCurIdx=i;
  $$('#tocList .toc-item').forEach(el=>{
    el.classList.toggle('cur', el.dataset.b!==undefined && +el.dataset.b===i);
  });
}
function tocMarkByHref(href){
  if(!href||!tocItemsCache.length) return;
  const norm=s=>(s||'').replace(/^(\.\/)+/,'').split('#')[0];
  const base=s=>norm(s).split('/').pop();
  let i=tocItemsCache.findIndex(t=>t.href&&norm(t.href)===norm(href));
  if(i<0) i=tocItemsCache.findIndex(t=>t.href&&base(t.href)===base(href));
  if(i>=0) tocMarkCur(i);
}
function tocMarkByChapter(ch){
  const i=tocItemsCache.findIndex(t=>t.ch===ch);
  if(i>=0) tocMarkCur(i);
}
function tocMarkByPage(pg){
  let i=-1;
  tocItemsCache.forEach((t,k)=>{ const p=parseInt(t.target,10); if(p&&p<=pg) i=k; });
  if(i>=0) tocMarkCur(i);
}
function renderToc(builtin, onJump){
  const custom=(cur.book.toc||[]);
  /* 第十四批：换书时把「当前章」重算（否则新书里同下标的项会被旧高亮认领） */
  const bid=(cur.book&&cur.book.id)||'';
  if(bid!==tocCacheBookId){ tocCacheBookId=bid; tocCurIdx=-1; }
  tocItemsCache=builtin.map(t=>({href:t.href||'', ch:t.ch, target:t.custom?t.custom.target:undefined}));
  let h='';
  if(custom.length){
    h+= `<div style="font-size:11px;color:var(--fg2);margin-bottom:4px">自定义目录</div>`;
    /* 第十四批：自定义目录本身就是顶层 ⇒ 一并按「一级索引标签」呈现 */
    h+= custom.map((t,i)=>`<div class="toc-item lv1" data-c="${i}">${esc(t.label)}</div>`).join('');
    if(builtin.length) h+=`<div style="font-size:11px;color:var(--fg2);margin:10px 0 4px">书内目录</div>`;
  }
  /* 先扫两件事：① 每项是否「有子项」（紧邻下一项更深即算）② 谁被父项折叠藏起来。
     用「藏到某个深度为止」的单遍扫描，天然支持多层嵌套，不必真建树。 */
  const hasKid=builtin.map((t,i)=> i+1<builtin.length && (builtin[i+1].depth||0) > (t.depth||0));
  const hidden=new Array(builtin.length).fill(false);
  let hideDeeperThan=-1;
  builtin.forEach((t,i)=>{
    const d=t.depth||0;
    if(hideDeeperThan>=0 && d>hideDeeperThan) hidden[i]=true; else hideDeeperThan=-1;
    if(!hidden[i] && hasKid[i] && tocCollapsed.has(i)) hideDeeperThan=d;
  });
  h+= builtin.map((t,i)=>{
    if(hidden[i]) return '';
    const d=t.depth||0;
    const caret = hasKid[i]
      ? `<span class="toc-caret${tocCollapsed.has(i)?' off':''}" data-t="${i}" title="${tocCollapsed.has(i)?'展开子目录':'折叠子目录'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>`
      : `<span class="toc-caret none"></span>`;
    /* 第十四批：`lv${d+1}` 是层级钩子（**1-based**：depth 0 = 一级 = lv1），
       一级标题要做成右侧索引标签、并按深度决定形态 —— 不能只靠内联 padding-left，
       那个没法在选择器里用来表层级。
       `cur` 是「当前章节」标记（由 tocMarkCur 按阅读位置切换，不靠重绘）。 */
    return `<div class="toc-item lv${d+1}${i===tocCurIdx?' cur':''}" data-b="${i}" style="padding-left:${4+d*14}px">${caret}<span class="toc-lb">${esc(t.label)}</span></div>`;
  }).join('');
  $('#tocList').innerHTML=h||'<div style="font-size:12px;color:var(--fg2)">无目录</div>';
  $$('#tocList .toc-item').forEach(el=>el.onclick=()=>{
    panelToggle('');
    if(el.dataset.c!==undefined) onJump({custom:custom[el.dataset.c]});
    else onJump({builtin:builtin[el.dataset.b]});
  });
  /* 箭头只切折叠态并重绘（stopPropagation 挡住整行的跳章），折叠状态在同一本书内保持 */
  $$('#tocList .toc-caret[data-t]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const i=+el.dataset.t;
    tocCollapsed.has(i) ? tocCollapsed.delete(i) : tocCollapsed.add(i);
    renderToc(builtin, onJump);
  });
}

/* ============ EPUB ============ */
/* 把选区范围 CFI（epubcfi(A,B,C)）转为起点 CFI（epubcfi(A,B)），用于精确跳转；
   bookmark 已是点 CFI，原样返回 */
function cfiStartOf(cfi){
  if(typeof cfi!=='string') return cfi;
  const last=cfi.lastIndexOf(',');
  if(last<0) return cfi;
  const before=cfi.slice(0,last);
  if(before.lastIndexOf(',')<0) return cfi; // 已经是点 CFI
  return before+')';
}
function epubApplySet(k){
  const r=cur.engine; if(!r)return;
  if(k==='flow'||k==='spread'){ epubReflow(); return; }
  epubInjectStyles();
}
/* EPUB 设置必须以“样式表规则 + !important”直接命中 p/div 等文本元素。
   epub.js 默认的 themes.override 只是把样式写到 html/body（继承值），
   会被书籍在 p 上直接声明的 line-height / font-size / font-family 压过，
   这正是中文 EPUB 行间距（及字号/字体）无法调整的根因。
   改用 addStylesheetCss 注入真实样式表规则，并挂到 content 钩子，保证每一章都套用。 */
/* 需求7/8（第五批）：给每个章节文档打排版标记。
   ① html 打 id=rd-typo —— 注入的样式靠它把特异度抬到 id 级，才压得过书内自带的字体声明
      （书内自带字体的 EPUB 常写 `body.calibre p{font-family:…!important}`，光有 !important 打不过）；
   ② body 里**第一个**标题打 .rd-ch-title —— 「—— · ——」分割线只挂它下面。
   两者都幂等（打过了就不再动），三条注入路径都会调它。 */
const TYPO_ID='rd-typo';
/* 需求3（第八批）电脑档正文末尾的 36px 留白。
   ⚠️ 为什么**必须**是真节点，而不能用 CSS（这条是踩过坑的，别再回退）：
   epub.js 的滚动高度取自 `Range.selectNodeContents(body).getBoundingClientRect().bottom`
   （源码 `Contents.textHeight()`）—— 只算 body **后代元素**的盒子，body 自己的 padding-bottom
   与伪元素 ::after **都不计入**。于是它把 iframe 高度写死成「末元素底边」（实测 2607 = 36 padding-top + 正文），
   任何 CSS 造出来的下方留白都落在 iframe 框外，读到底最后一行照样贴死屏幕底边。
   探针 _w6/_w7 实测三种写法：body padding-bottom → gap 0；body::after 36px → gap 0；**真节点 → gap 36**。
   故此处往 body 末尾塞一个 36px 的空 div：它是真后代 ⇒ 进 range、进高度、进滚动区。
   判定与 wrapCss 的 `#rd-typo.rd-desk body` 同源（同一个 `epubDeskOn()`），平板/手机既不加类也不加节点。 */
const RD_DESK_MQ='(min-width:1024px)';
function epubDeskOn(){
  try{ if(rset.flow!=='scrolled') return false; }catch(e){}
  try{ return !window.matchMedia || window.matchMedia(RD_DESK_MQ).matches; }catch(e){ return true; }
}
function epubDesk(doc){
  if(!doc||!doc.documentElement||!doc.body) return;
  const on=epubDeskOn();
  try{ doc.documentElement.classList.toggle('rd-desk', on); }catch(e){}
  const old=doc.getElementById('rdEndGap');
  if(!on){ if(old) old.remove(); return; }
  if(old) return;
  const d=doc.createElement('div'); d.id='rdEndGap';
  d.style.cssText='height:36px;line-height:0;font-size:0;';
  doc.body.appendChild(d);
}
/* 真机改窗口跨过 1024 时补/撤这条留白（媒体查询管不到 JS 塞的节点）。 */
try{ matchMedia(RD_DESK_MQ).addEventListener('change',()=>{ try{ epubInjectStyles(); }catch(e){} }); }catch(e){}
function epubPrepDoc(doc){
  if(!doc||!doc.documentElement) return;
  try{ if(doc.documentElement.id!==TYPO_ID) doc.documentElement.id=TYPO_ID; }catch(e){}
  try{
    if(doc.body && !doc.__rdChTitle){
      doc.__rdChTitle=1;
      const h=doc.body.querySelector('h1,h2,h3,h4,h5,h6');
      if(h && (h.textContent||'').trim()) h.classList.add('rd-ch-title');
    }
  }catch(e){}
  try{ epubDesk(doc); }catch(e){}
}
function epubSetCss(){

/* 防 EPUB 章节 XML 不合法导致整章解析失败：
   epub.js 解析 XHTML/XML 时走原生 DOMParser.prototype.parseFromString（utils.parse 属性是
   只读 getter，不能整体替换），故包在 DOMParser 原型这一真实通道上，仅 mime 含 "xml" 时介入：
   ① 裸 &（非合法实体 #n; #xX; xxx;）→ 转成 &amp;，消 EntityRef: expecting ';'；
   ② 若严格解析仍产生 parsererror（Word/网页转书常见的 <font>/<p> 标签错配等结构错误），
      用 text/html 容错解析重建 DOM，再 XMLSerializer 序列化成良构 XML 重新严格解析——
      浏览器 HTML 解析器会自动闭合/纠正错配标签，Serializer 保证输出合法转义。
   只对“解析失败”的书走 ②，正常书零额外开销。幂等。 */
let _xmlSanitizerInstalled=false;
function installXmlSanitizer(){
  if(_xmlSanitizerInstalled) return;
  _xmlSanitizerInstalled=true;
  try{
    const proto=(typeof DOMParser!=='undefined')&&DOMParser.prototype;
    if(!proto || typeof proto.parseFromString!=='function') return;
    if(proto.parseFromString.__sanitized) return;
    const orig=proto.parseFromString;
    proto.parseFromString=function(markup, mime){
      if(typeof markup==='string' && typeof mime==='string' && /xml/i.test(mime)){
        /* ① 裸 & → &amp;（合法实体 #n; / #xX; / xxx; 保留；&quot 漏分号等一并转义） */
        markup=markup.replace(/&(?!(?:#\d+|#x[0-9a-fA-F]+|[a-zA-Z][a-zA-Z0-9]*);)/g,'&amp;');
        const doc=orig.call(this, markup, mime);
        /* ② 严格解析失败（标签错配等结构问题）→ HTML 容错重建兜底 */
        if(doc && typeof doc.getElementsByTagName==='function' && doc.getElementsByTagName('parsererror').length){
          try{
            const loose=new DOMParser().parseFromString(markup,'text/html');
            const fixed='<?xml version="1.0" encoding="utf-8"?>\n'+new XMLSerializer().serializeToString(loose);
            const doc2=orig.call(this, fixed, mime);

          }catch(e){ /* 重建失败则保留原 parsererror 文档 */ }
        }
        return doc;
      }
      return orig.call(this, markup, mime);
    };
    proto.parseFromString.__sanitized=true;
  }catch(e){ console.warn('XML 容错清洗未生效：', e); }
}

     引擎与字节并行：ensureLib 是异步的，先把它点着，别让解析空等网络。 */

    /* 需求4（2026-09-22 第二轮修正）：**滚轮/触摸**与「点击」同理，也必须进 iframe。
       scrolled-doc 下 iframe 被撑到整章高度、铺满正文可视区 ⇒ 事件只落在 iframe 文档里，
       父文档收不到（真机计数 parent 0 / iframe 1）。见 rdEdgeBind 的说明。 */
    try{ if(c.document) rdEdgeBind(c.document); }catch(e){}
    /* 需求7/8（第五批）：本章文档的排版标记（html 的 id + 首个标题的 .rd-ch-title） */
    epubPrepDoc(c.document);
    epubFixListsTables(c);
    /* 每章加载时把本书所有 EPUB 标注画到当前章节（epub.js 的 annotations
       只对“当前内容文档”生效，若启动时统一画会因 contents 尚未就绪而全部失败，
       导致大部分书的已存高亮/批注不显示。改在 content 钩子里按章重画，
       不属于本章的标记会被文本匹配/CFI 解析安全跳过，不会报错）。
       传入 c.document：DOM 自绘的所有 createElement/createTreeWalker 都在
       该内容文档内进行（顶层 document 操作会跨 iframe 抛错）。 */
    epubPaintBookMarks(c.document);

  });
  epubApplySet();
  r.on('relocated',loc=>epubRelocated(loc));
  r.on('rendered',()=>{ try{ epubInjectStyles(); }catch(e){} });
  r.on('selected',async (cfiRange,contents)=>{

       1) 主路径用浏览器真实 DOM 选区（contents.window.getSelection().toString()）——
          epub.js 的 selected 事件给的两字段相对式 cfiRange，book.getRange 解析时

          DOM selection 是浏览器按用户真实划选计算的文本，永远完整。
       2) getRange 仅作兜底（selection 不可用/为空时），且必须 await（异步）。 */
    let text='';
    try{
      const sel=contents&&contents.window&&contents.window.getSelection();
      if(sel && sel.rangeCount) text=sel.toString();
    }catch(e){}
    if(!text){
      try{
        if(cur._book && typeof cur._book.getRange==='function'){
          const rg=await cur._book.getRange(cfiRange);
          if(rg) text=rg.toString();
        }
      }catch(e){}
    }
    /* 不截断：完整存到 DB，UI 由 CSS 截断 */
    let x=innerWidth/2,y=80;
    try{
      const sel=contents&&contents.window&&contents.window.getSelection();
      const rect=sel&&sel.rangeCount?sel.getRangeAt(0).getBoundingClientRect():null;
      const iframe=$('#rdView').querySelector('iframe');
      const ir=iframe?iframe.getBoundingClientRect():{left:0,top:0};
      if(rect){ x=ir.left+rect.left+rect.width/2; y=ir.top+rect.top; }
    }catch(e){}
    showSelMenu(x,y,{apply:async(kind,note)=>{
      const r=await addMark({type:kind==='note'?'note':'highlight',loc:cfiRange,locStart:cfiStartOf(cfiRange),locText:'',text,note});
      /* 视觉同步由 addMark 内部统一处理：新增时画一次，合并时调 epubRepaintAll 清掉旧 + 画新并集。
         此处不再手工 remove prevLoc + paint，避免双重操作。 */
      try{contents.window.getSelection().removeAllRanges();}catch(e){}
    }});
  });
  await r.display(startCfi);
  _lt('first-paint');
}
/* 把本书所有 EPUB 高亮/批注画到指定章节内容文档。
   由 content 钩子每章调用（传入 c.document）；不属于本文档的标记（文本匹配不到）会被安全跳过。 */
async function epubPaintBookMarks(doc){
  try{
    const list=marksOf(cur.book.id).filter(m=>m.format==='epub'&&m.type!=='bookmark');
    for(const m of list) await epubPaintMark(m, doc);
  }catch(e){}
}
/* ================= DOM 自绘（文本锚定） =================
   替代 epub.js annotations.highlight/underline：
   1) epub.js 对两字段相对式 / 自制双端点 / 带 [id]+大 child index 的 range CFI 解析不可靠
      （end=null / path.steps 空），annotations 画不全——「只显示前半段/后半段」的总根因。
   2) 因此绘制不依赖 range CFI 解析，按以下顺序：
      主路径1：单点 CFI（locStart/absStart，epub.js 对单点解析稳定）锚定起点，向后精确匹配 m.text；
      主路径2：在目标内容文档里全文精确匹配 m.text（text 来自 DOM selection，与 DOM 逐字一致）；
      兜底1  ：book.getRange(m.loc) 全范围（TreeWalker filter 已修正、跨 iframe document 已修正）；
      兜底2  ：epub.js annotations（保留兼容）。
   3) 所有 DOM 操作都在目标内容文档（iframe）内完成：createElement / createTreeWalker /
      createRange 一律用 doc 而不是顶层 document——跨 document 插入会抛 HierarchyRequestError。 */
/* 单点 CFI → DOM 文本位置（锚点）。epub.js 对单点 CFI 的解析稳定可靠。 */
async function cfiToDomAnchor(m){
  if(!cur._book || typeof cur._book.getRange!=='function') return null;
  const cand=[];
  if(typeof m.locStart==='string') cand.push(m.locStart);
  if(typeof m.loc==='string'){ const r=cfiRangeEnds(m.loc); if(r&&r.absStart) cand.push(r.absStart); }
  for(let c of cand){
    if(!c) continue;
    if(c.indexOf(',')>=0){ const r=cfiRangeEnds(c); if(!r) continue; c=r.absStart; }  /* locStart 可能是 range */
    if(!c) continue;
    try{
      const full=c.indexOf('epubcfi(')===0?c:'epubcfi('+c+')';
      const rg=await cur._book.getRange(full);
      if(rg && rg.startContainer && rg.startContainer.nodeType===3 && rg.startContainer.data){
        return {node:rg.startContainer, offset:rg.startOffset};
      }
    }catch(e){}
  }
  return null;
}
/* 文档全文文本索引（每次现建，不缓存——DOM 包裹后内容会变，缓存易脏）。
   归一化为「去空白」串（\s 全部去掉）同时记录每个输出字符的原始位置映射：
   selection.toString() / range.toString() 在块级元素边界会插入换行，而 DOM
   文本拼接没有——按空白折叠（→' '）仍可能对不上（DOM 边界无空白时 hay 无空格、
   needle 有空格），必须彻底去空白再匹配，空白差异全部消解。 */
function docTextIndex(doc){
  const parts=[];
  const root=doc.body||doc.documentElement;
  if(root){
    const walker=doc.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(n){ return (n.data&&n.data.length)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT; }
    });
    let n=walker.nextNode();
    while(n){ parts.push({node:n, raw:n.data, base:0}); n=walker.nextNode(); }
  }
  let hay=''; const map=[];
  for(let pi=0;pi<parts.length;pi++){
    const raw=parts[pi].raw;
    for(let ci=0;ci<raw.length;ci++){
      const ch=raw[ci];
      if(/\s/.test(ch)) continue;
      hay+=ch; map.push({pi,ci});
    }
  }
  return {hay, parts, map};
}
function normText(t){ return String(t||'').replace(/\s+/g,''); }
/* 全文匹配：text（去空白后）首次出现 → {sc,so,ec,eo}；找不到返回 null */
function textRangeInDoc(doc, text){
  if(!text || !doc) return null;
  const {hay,parts,map}=docTextIndex(doc);
  const needle=normText(text);
  if(!needle) return null;
  const idx=hay.indexOf(needle);
  if(idx<0) return null;
  return mapToRange(parts,map,idx,needle.length);
}
/* 从锚点（文本节点+offset）向后匹配 text（锚点=用户划选起点，全文多次出现相同文本时不错位） */
function textRangeFromAnchor(anchor, text){
  if(!text || !anchor || !anchor.node) return null;
  const doc=anchor.node.ownerDocument;
  const parts=[];
  const first=anchor.node.data.slice(anchor.offset);
  if(first) parts.push({node:anchor.node, raw:first, base:anchor.offset});
  const root=doc.body||doc.documentElement;
  if(root){
    const walker=doc.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(n){ return (n.data&&n.data.length)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT; }
    });
    let cur=anchor.node;
    for(;;){
      walker.currentNode=cur;
      const n=walker.nextNode();
      if(!n) break;
      if(n.data&&n.data.length) parts.push({node:n, raw:n.data, base:0});
      cur=n;
    }
  }
  let hay=''; const map=[];
  for(let pi=0;pi<parts.length;pi++){
    const raw=parts[pi].raw;
    for(let ci=0;ci<raw.length;ci++){
      const ch=raw[ci];
      if(/\s/.test(ch)) continue;
      hay+=ch; map.push({pi,ci});
    }
  }
  const needle=normText(text);
  if(!needle) return null;
  const idx=hay.indexOf(needle);
  if(idx<0) return null;
  return mapToRange(parts,map,idx,needle.length);
}
/* 折叠索引 → DOM 范围（map[i] 记录折叠后第 i 字符对应的原始节点/偏移） */
function mapToRange(parts, map, idx, len){
  if(!parts.length || idx<0 || len<=0) return null;
  const sMap=map[idx], eMap=map[idx+len-1];
  if(!sMap||!eMap) return null;
  const sc=parts[sMap.pi].node, so=parts[sMap.pi].base+sMap.ci;
  const ec=parts[eMap.pi].node, eo=parts[eMap.pi].base+eMap.ci+1;
  if(!sc || !ec || eo>ec.data.length) return null;
  if(sc===ec && eo<=so) return null;   /* 空范围 */
  return {sc,so,ec,eo};
}
/* 公共包裹：把 [sc,so)~(ec,eo) 文本用 span 包裹（kind: 'hl' | 'note'）。
   全部 DOM 操作使用目标内容文档 doc，避免跨 iframe document 抛错。 */
function wrapRange(sc, so, ec, eo, m, kind, doc){
  if(!sc || !ec) return false;
  if(!doc) doc=sc.ownerDocument;
  if(!doc) return false;
  const bg=(rset.bg==='night')?'rgba(220,220,220,.3)':'rgba(255,213,79,.4)'; /* 夜间浅灰；浅色主题荧光黄（黑底内容也可见） */
  const makeSpan=()=>{
    const span=doc.createElement('span');
    if(kind==='note'){
      /* 用 setProperty + !important：EPUB iframe 内的 CSS（链接/标题的 text-decoration:none/underline）
         会覆盖普通属性，导致下划虚线不显示；important 提升优先级绕开 EPUB 样式 */
      span.style.setProperty('text-decoration','underline dashed','important');
      span.style.setProperty('text-decoration-thickness','1.5px','important');
      span.style.setProperty('text-decoration-color','currentColor','important');
      span.style.setProperty('text-underline-offset','3px','important');
    }else{
      span.style.backgroundColor=bg;
      span.style.borderRadius='2px';
    }
    span.dataset.mid=m.id;
    span.dataset.kind=kind;
    span.title=m.note||'';
    span.onclick=(e)=>{e.stopPropagation();e.preventDefault();const mk=marksAll.find(x=>x.id===m.id);if(mk&&mk.note)showNote(mk);};
    return span;
  };
  const splitText=(tn,sOff,eOff)=>{
    if(sOff===eOff) return false;
    const before=tn.data.slice(0,sOff);
    const middle=tn.data.slice(sOff,eOff);
    const after=tn.data.slice(eOff);
    if(!middle) return false;
    tn.data=before;
    const span=makeSpan();
    span.textContent=middle;
    const parent=tn.parentNode;
    if(!parent) return false;
    const ref=tn.nextSibling;
    parent.insertBefore(span, ref);
    if(after){
      const afterNode=doc.createTextNode(after);
      parent.insertBefore(afterNode, span.nextSibling);
    }
    return true;
  };
  if(sc===ec) return splitText(sc,so,eo);
  /* 跨节点：TreeWalker 收集范围内文本节点。
     compareBoundaryPoints 语义（MDN）：END_TO_START 实际比较 this.start 与 other.end，
     START_TO_END 比较 this.end 与 other.start（命名反直觉）：
       - 节点完全在 range 之后（nr.start >= r.end）→ r.end <= nr.start → START_TO_END <= 0 → 拒绝
       - 节点完全在 range 之前（nr.end <= r.start）→ r.start >= nr.end → END_TO_START >= 0 → 拒绝 */
  const wdoc=sc.ownerDocument||doc;
  let nodes=[];
  try{
    const r=wdoc.createRange();
    r.setStart(sc,so); r.setEnd(ec,eo);
    const walker=wdoc.createTreeWalker(r.commonAncestorContainer, NodeFilter.SHOW_TEXT, {
      acceptNode(n){
        if(!n.data) return NodeFilter.FILTER_REJECT;
        const nr=wdoc.createRange();
        nr.selectNodeContents(n);
        if(r.compareBoundaryPoints(Range.START_TO_END,nr)<=0) return NodeFilter.FILTER_REJECT;
        if(r.compareBoundaryPoints(Range.END_TO_START,nr)>=0) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    let n=walker.nextNode();
    while(n){ nodes.push(n); n=walker.nextNode(); }
  }catch(e){ return false; }
  if(!nodes.length) return false;
  let ok=false;
  for(const tn of nodes){
    const isStart=tn===sc, isEnd=tn===ec;
    const sOff=isStart?so:0;
    const eOff=isEnd?eo:tn.data.length;
    if(splitText(tn,sOff,eOff)) ok=true;
  }
  /* 兜底：start/end 节点可能因边界条件被 filter 拒掉，单独补画 */
  if(!ok){
    if(splitText(sc,so,sc.data.length)) ok=true;
    if(sc!==ec && splitText(ec,0,eo)) ok=true;
  }
  return ok;
}
/* 主绘制函数。doc = 目标内容文档（当前章 iframe）。返回是否画上。 */
async function hlWrap(m, doc, kind){
  kind=kind||'hl';
  /* 主路径1：单点 CFI 锚定 + 向后精确匹配 m.text（全文多次出现相同文本时不错位）。
     区分两种失败原因，决定是否回退到主路径2：
       - 锚点不可用（cfiToDomAnchor=null）→ 主路径2 全文匹配可用（兜底）
       - 锚点可用但 text 与锚点不一致（text 与 loc 起点的 DOM 字符不匹配）→ text 含 cfiRange
         start 之前的残留字符（如第 8 轮 getRange 解析 bug 产物），不应回退到全文匹配
         （否则会在 hay 中错位找到首次出现，画错位 span 与其他标记叠加造成「视觉连成
         一段」的假象）。直接走 fallback getRange(m.loc)/annotations。 */
  let anchorMatched=false;
  if(cur._book && typeof cur._book.getRange==='function'){
    const anchor=await cfiToDomAnchor(m);
    if(anchor){
      const tr=textRangeFromAnchor(anchor, m.text);
      if(tr){ anchorMatched=true; return wrapRange(tr.sc,tr.so,tr.ec,tr.eo,m,kind,anchor.node.ownerDocument); }
    }
  }
  /* 主路径2：锚点完全不可用，或锚点可用但 textRangeFromAnchor 匹配失败（text 被
     reconcile 重写后含残留字符）时，都尝试全文匹配兜底——至少画上，用户重划即修正，
     优于"完全不画"。 */
  if(doc && !anchorMatched){
    const tr=textRangeInDoc(doc, m.text);
    if(tr) return wrapRange(tr.sc,tr.so,tr.ec,tr.eo,m,kind,doc);
  }
  /* 兜底1：book.getRange(m.loc) 全范围（CFI 解析仍可能半失败，能画多少画多少） */
  if(cur._book && typeof cur._book.getRange==='function'){
    let range;
    try{ range=await cur._book.getRange(m.loc); }catch(e){ range=null; }
    if(range && range.startContainer && range.endContainer &&
       range.startContainer.nodeType===3 && range.endContainer.nodeType===3){
      const sdoc=range.startContainer.ownerDocument;
      if(wrapRange(range.startContainer,range.startOffset,range.endContainer,range.endOffset,m,kind,sdoc)) return true;
    }
  }
  return false;
}
function hlWrapNote(m, doc){ return hlWrap(m, doc, 'note'); }
/* 移除指定 mid 的包裹 span（docs：所有渲染 iframe 的内容文档；默认顶层 document） */
function hlUnwrap(mid, docs){
  const dl=(docs&&docs.length)?docs:[document];
  for(const doc of dl){
    let spans=null;
    try{ spans=doc.querySelectorAll('[data-mid="'+mid+'"]'); }catch(e){ continue; }
    spans.forEach(span=>{
      const parent=span.parentNode;
      if(!parent) return;
      while(span.firstChild) parent.insertBefore(span.firstChild, span);
      parent.removeChild(span);
      parent.normalize();
    });
  }
}
async function epubPaintMark(m, doc){
  try{
    /* 优先用 DOM 自绘（文本锚定，替代 epub.js annotations——后者对特殊 CFI 画不全） */
    const ok = m.type==='note' ? await hlWrapNote(m, doc) : await hlWrap(m, doc);
    if(!ok){
      /* fallback：旧 epub.js annotations 路径（保留兼容） */
      if(m.type==='note'){
        const u=cur.engine.annotations.underline(m.loc,{},()=>showNote(m),'note');
        if(u&&u.element){
          u.element.setAttribute('class','note-ul');
          u.element.querySelectorAll('line').forEach(ln=>{
            ln.setAttribute('stroke','currentColor');
            ln.setAttribute('stroke-width','1.6');
            ln.setAttribute('stroke-dasharray','4,3');
            ln.setAttribute('stroke-linecap','round');
          });
        }
        ensureNoteStyle();
      } else {
        cur.engine.annotations.highlight(m.loc,{},()=>{ if(m.note) showNote(m); },'hl',
          {fill:'rgba(43,43,43,.22)','fill-opacity':'1'});
      }
    }
    if(!cur._paintedMap) cur._paintedMap=new Map();
    cur._paintedMap.set(m.id,{loc:m.loc,kind:m.type==='note'?'underline':'highlight',method:ok?'dom':'annotation'});
  }catch(e){}
}
/* 收集所有渲染 iframe 的内容文档（paginated 模式一章可能多个 iframe，spread 双页同理） */
function epubContentDocs(){
  const docs=[];
  try{
    $('#rdView').querySelectorAll('iframe').forEach(ifr=>{ if(ifr.contentDocument) docs.push(ifr.contentDocument); });
  }catch(e){}
  return docs;
}
/* 全局视觉同步：先清掉所有已画注解（DOM span 或 epub.js annotations），
   再按当前 marks 列表对每个内容文档重画——保证屏幕与 DB 严格一致，无残留/叠加。 */
async function epubRepaintAll(){
  if(!cur||cur.fmt!=='epub'||!cur.engine) return;
  const docs=epubContentDocs();
  if(cur._paintedMap){
    for(const [id,info] of cur._paintedMap){
      if(info.method==='dom'){
        try{ hlUnwrap(id, docs); }catch(e){}
      } else {
        try{ cur.engine.annotations.remove(info.loc,info.kind); }catch(e){}
      }
    }
  }
  cur._paintedMap=new Map();
  const list=marksOf(cur.book.id).filter(m=>m.format==='epub'&&m.type!=='bookmark');
  /* 双页/多 iframe：每个内容文档独立画一次（文本匹配与 iframe 无关，天然适配）；
     没有 iframe 文档时传 null，绘制走单点锚点/annotations 兜底 */
  if(docs.length){
    for(const doc of docs){
      for(const m of list) await epubPaintMark(m, doc);
    }
  } else {
    for(const m of list) await epubPaintMark(m, null);
  }
}
/* 在阅读器文档 <head> 注入全局样式，确保 .note-ul 的 SVG line 始终显示为下划虚线。
   注入到顶层 document 而非 SVG 内部，避免 SVG 命名空间解析问题。
   同步注入到所有 EPUB iframe doc（epub.js 的 fallback underline 在 iframe 内创建 SVG line）。 */
function ensureNoteStyle(){
  if($('#note-ul-style')) return;
  const css='.note-ul line{stroke:currentColor !important;stroke-width:1.6 !important;'
    +'stroke-dasharray:4,3 !important;stroke-linecap:round !important}';
  const st=document.createElement('style');
  st.id='note-ul-style';
  st.textContent=css;
  document.head.appendChild(st);
  /* 同步注入到所有 EPUB iframe 内容文档（fallback underline 在 iframe 内创建 SVG） */
  document.querySelectorAll('iframe').forEach(ifr=>{
    try{
      const idoc=ifr.contentDocument; if(!idoc||!idoc.head) return;
      if(idoc.querySelector('#note-ul-style')) return;
      const s2=idoc.createElement('style');
      s2.id='note-ul-style';
      s2.textContent=css;
      idoc.head.appendChild(s2);
    }catch(e){}
  });
}
/* 取 EPUB 真实页码（来自书内 page-list 导航）；若无可映射页码则回退 null */
async function epubRealPage(cfi){
  try{
    const book=cur._book;
    if(!book||!book.pageList||!cfi) return null;
    const pl=book.pageList;
    if(pl.ready && typeof pl.ready.then==='function'){ try{ await pl.ready; }catch(e){} }
    if(typeof pl.pageFromCfi!=='function') return null;
    const pg=pl.pageFromCfi(cfi);
    if(pg===-1||pg==null) return null;
    return pg;
  }catch(e){ return null; }
}
function epubRelocated(loc){
  cur._loc=loc;
  try{ const href=loc.start&&loc.start.href; if(href){ cur._chapterTitle=epubTitleFromHref(href)||''; tocMarkByHref(href); } }catch(e){}
  let pct=loc.start.percentage;
  if(cur._book.locations.length()) pct=cur._book.locations.percentageFromCfi(loc.start.cfi);
  const percent=Math.min(100,Math.round((pct||0)*1000)/10);
  const old=progMap[cur.book.id]||{loc:{}};
  saveProgress({percent, loc:{...(old.loc||{}),epub:loc.start.cfi}});
}
function spineHref(href){
  /* 把目录/CFI 得到的相对 href 解析成 spine 中的规范化 href，
     避免 toc 路径与 spine 路径前缀不一致导致 display(href) 找不到章节（跳转失效）。 */
  try{
    const book=cur._book; if(!book||!book.spine) return href;
    let s=book.spine.get(href); if(s&&s.href) return s.href;
    const b=(href||'').split('/').pop().split('#')[0];
    const items=(book.spine.spineItems)||[];
    for(const it of items){ if(it.href.split('/').pop().split('#')[0]===b) return it.href; }
  }catch(e){}
  return href;
}
function epubTitleFromHref(href){
  try{
    const book=cur._book; if(!book) return '';
    const toc=(book.navigation&&book.navigation.toc)||[];
    const norm=s=>(s||'').replace(/^(\.\/)+/,'').split('#')[0];
    const base=s=>norm(s).split('/').pop();
    let hit='';
    (function walk(items){ (items||[]).forEach(it=>{ if(it.href && (norm(it.href)===norm(href)||base(it.href)===base(href))) hit=it.label; walk(it.subitems); }); })(toc);
    if(hit) return hit.trim();
    /* spine 兜底：toc 缺失或 href 路径不一致时，按文件名匹配章节，取真实 label 或“第N章” */
    const b=base(href);
    const items=(book.spine&&book.spine.spineItems)||[];
    for(let i=0;i<items.length;i++){ if(base(items[i].href)===b){ const lb=items[i].label; return (lb&&String(lb).trim())?String(lb).trim():('第'+(i+1)+'章'); } }
    return '';
  }catch(e){ return ''; }
}
/* 翻页兜底：若 next()/prev() 未能真正翻动（偶发卡在章节边界/空白），
   监听 relocated 未触发时按百分比前移约 0.5%，避免“翻页失效”卡死 */
function epubNav(dir){
  if(!cur||!cur.engine) return;
  const before = cur._loc && cur._loc.start.cfi;
  let fired=false;
  const onRel=()=>{ fired=true; };
  try{ cur.engine.on('relocated', onRel); }catch(e){}
  try{ if(dir>0) cur.engine.next(); else cur.engine.prev(); }catch(e){}
  setTimeout(()=>{
    try{ cur.engine.off('relocated', onRel); }catch(e){}
    if(!fired && before && cur._book && cur._book.locations.length()){
      const pct = cur._book.locations.percentageFromCfi(before) || 0;
      const np = Math.min(1, Math.max(0, pct + (dir>0 ? 0.005 : -0.005)));
      try{ cur.engine.display(cur._book.locations.cfiFromPercentage(np)); }catch(e){}
    }
  }, 700);
}

   与「翻页模式下的前后划」都走这里，不再依赖已被删除的按钮。 */

const PDF_MAX_CANVAS = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)?4096:8192;
function pdfCapScale(cssScale,vp0){
  const dpr=window.devicePixelRatio||1;
  const maxS=Math.min(PDF_MAX_CANVAS/Math.max(1,vp0.width*dpr), PDF_MAX_CANVAS/Math.max(1,vp0.height*dpr));
  return Math.max(.2, Math.min(cssScale, maxS));
}
/* 判断 PDF 页面是否“无任何可绘制内容”（如 q/cm/Q 空流、转换损坏的文件）。
   注意 pdfjs 的 OPS 枚举键是名称、值是数字编码，需反查成名称再比对白名单。 */
let __pdfOpsName=null;
function pdfOpsName(lib){
  if(!__pdfOpsName){ __pdfOpsName={}; try{ const o=lib.OPS; for(const k in o) __pdfOpsName[o[k]]=k; }catch(e){} }
  return __pdfOpsName;
}
const PDF_NO_OP=new Set(['dependency','save','restore','transform','setLineWidth','setLineCap','setLineJoin','setMiterLimit','setDash','setRenderingIntent','setFlatness','setGState','setLineDash','setStrokeColorSpace','setFillColorSpace','setStrokeColor','setStrokeColorN','setFillColor','setFillColorN','setStrokeGray','setFillGray','setStrokeRGBColor','setFillRGBColor','setStrokeCMYKColor','setFillCMYKColor','markPoint','markPointProps','beginMarkedContent','beginMarkedContentProps','endMarkedContent','endMarkedContentProps']);
async function pdfPageEmpty(page, lib){
  try{
    const ops=await page.getOperatorList();
    const name=pdfOpsName(lib);
    return !ops.fnArray.some(c=>{ const n=name[c]; return n && !PDF_NO_OP.has(n); });
  }catch(e){ return false; }
}

async function pdfBuildTextLayer(page, tl, vp, pg){

    tl.style.setProperty('--total-scale-factor', String(vp.scale));
    tl.style.setProperty('--scale-round-x','1px');
    tl.style.setProperty('--scale-round-y','1px');

    await layer.render();

/* 把当前书在该页的高亮/批注画到文本层 span 上 */
function pdfPaintPage(pg, tl){
  if(!cur||!tl) return;
  const st=(cur._pdfTxt||{})[pg]; if(!st) return;
  const marks=marksOf(cur.book.id).filter(m=>m.format==='pdf'&&m.type!=='bookmark'&&m.loc&&m.loc.pdf===pg);
  st.divs.forEach(d=>{ d.classList.remove('pdf-hl','pdf-nt'); d.style.background=''; delete d.dataset.mk; });
  marks.forEach(m=>{
    const from=m.loc.from, to=m.loc.to;
    for(let i=0;i<st.divs.length;i++){
      const d=st.divs[i], d0=st.offsets[i], d1=d0+(d.textContent||'').length;
      if(d1>from && d0<to){
        if(m.type==='note') d.classList.add('pdf-nt');

/* 选区归属页面：anchor/focus 所在的文本层 */
function pdfSelPageOf(sel){
  for(const n of [sel.anchorNode, sel.focusNode]){
    let el=n; while(el&&el.nodeType!==1) el=el.parentNode;
    const tl=el&&el.closest?el.closest('.pdf-textlayer'):null;
    if(tl&&tl.dataset.pg) return Number(tl.dataset.pg);
  }

}
/* PDF 划选：把选区映射为 {pdf:页码, from, to} 字符区间 */
function pdfSelCheck(fx,fy){
  if(!cur||cur.fmt!=='pdf')return;
  const sel=window.getSelection();
  if(!sel||sel.isCollapsed)return;
  const text=sel.toString().trim().slice(0,120);
  if(!text)return;
  const pg=pdfSelPageOf(sel); if(!pg)return;
  const st=(cur._pdfTxt||{})[pg]; if(!st)return;
  const pos=(node,off)=>{
    if(!node) return -1;
    let el=node;
    if(node.nodeType===3) el=node.parentElement;
    else if(node.nodeType===1) off=0;
    if(!el||!el.dataset||el.dataset.i==null) return -1;
    const i=Number(el.dataset.i); if(isNaN(i)) return -1;
    let base=st.offsets[i]||0;
    if(node.nodeType===3) base+=Math.max(0,Math.min(off,node.nodeValue?node.nodeValue.length:0));
    return base;
  };
  let a=pos(sel.anchorNode,sel.anchorOffset), b=pos(sel.focusNode,sel.focusOffset);
  if(a<0||b<0) return;
  let x=fx,y=fy;
  try{const r=sel.getRangeAt(0).getBoundingClientRect(); if(r&&(r.width||r.height)){x=r.left+r.width/2;y=r.top;}}catch(e){}
  showSelMenu(x,y,{apply:async(kind,note)=>{
    await addMark({type:kind==='note'?'note':'highlight',loc:{pdf:pg,from:Math.min(a,b),to:Math.max(a,b)},locText:'第 '+pg+' 页',text,note});
    try{sel.removeAllRanges();}catch(e){}

    if(tl) pdfPaintPage(pg,tl);

/* 模式装配：翻页模式 = 单屏渲染；滚动模式 = 占位符 + 懒渲染 */
async function pdfSetupMode(){

  wrap.onscroll=null;

      const ph=document.createElement('div');

    },{root:wrap, rootMargin:'600px 0px'});

/* 滚动模式单页懒渲染 */
async function pdfRenderPage(pn, ph){
  if(!cur||!cur._doc)return;
  const key=String(cur._zoom);
  if(ph.dataset.done===key) return;
  ph.dataset.done=key;
  try{
    const wrap=$('#pdfWrap');
    const page=await cur._doc.getPage(pn);
    if(!cur||!cur._doc)return;
    if(await pdfPageEmpty(page,cur._pdfLib)){
      ph.innerHTML=`<div style="padding:40px 20px;color:var(--fg2);text-align:center;font-size:12px;line-height:1.9">第 ${pn} 页无内容<br><span style="font-size:11px">此页不包含任何文字或图形，可能是 PDF 本身为空或转换损坏</span></div>`;
      ph.style.minHeight='';
      return;
    }
    const vp0=page.getViewport({scale:1});
    let cssScale=Math.max(.2,(wrap.clientWidth-48)/vp0.width*(cur._zoom||1));
    cssScale=pdfCapScale(cssScale,vp0);
    const dpr=window.devicePixelRatio||1;
    const vp=page.getViewport({scale:cssScale*dpr});
    const vpCss=page.getViewport({scale:cssScale});
    const pw=document.createElement('div'); pw.className='pdf-page';
    const c=document.createElement('canvas');
    c.width=Math.ceil(vp.width); c.height=Math.ceil(vp.height);
    c.style.width=(c.width/dpr)+'px';
    pw.appendChild(c);
    const tl=document.createElement('div'); tl.className='pdf-textlayer'; tl.dataset.pg=pn;
    pw.appendChild(tl);
    ph.innerHTML=''; ph.style.minHeight=''; ph.appendChild(pw);
    await page.render({canvas:c,canvasContext:c.getContext('2d'),viewport:vp}).promise;
    await pdfBuildTextLayer(page,tl,vpCss,pn);

  }catch(e){
    ph.innerHTML=`<div style="padding:40px 20px;color:var(--fg2);text-align:center;font-size:12px">第 ${pn} 页渲染失败<br>${esc(e.message||'')}</div>`;
  }
}
/* 翻页模式渲染当前屏（支持单/双页与缩放） */
async function pdfRender(){

  const wrap=$('#pdfWrap'); if(!wrap||pdfFlow()==='scrolled')return;
  wrap.innerHTML='';
  const pages=pdfSpread()==='none'?[cur._page]:[cur._page,cur._page+1].filter(p=>p<=cur._total);
  const availW=wrap.clientWidth-40, availH=wrap.clientHeight-40;

        const empty=document.createElement('div');

        inner.appendChild(empty);

      }
      const vp0=page.getViewport({scale:1});
      const fit=Math.min((availW/pages.length-12)/vp0.width, availH/vp0.height);
      let cssScale=Math.max(.2, fit*(cur._zoom||1));
      cssScale=pdfCapScale(cssScale,vp0);
      const dpr=window.devicePixelRatio||1;
      const vp=page.getViewport({scale:cssScale*dpr});
      const vpCss=page.getViewport({scale:cssScale});
      const pw=document.createElement('div'); pw.className='pdf-page';
      const c=document.createElement('canvas');
      c.width=Math.ceil(vp.width); c.height=Math.ceil(vp.height);
      c.style.width=(c.width/dpr)+'px';
      pw.appendChild(c);
      const tl=document.createElement('div'); tl.className='pdf-textlayer'; tl.dataset.pg=pn;
      pw.appendChild(tl);
      inner.appendChild(pw);

/* ============ TXT ============ */
async function txtOpen(){
  _loadStage('正在解析文本…');
  const buf=await cur.file.blob.arrayBuffer();
  let text=new TextDecoder('utf-8',{fatal:false}).decode(buf);
  const bad=(text.slice(0,4000).match(/\uFFFD/g)||[]).length;
  if(bad>4){ try{text=new TextDecoder('gbk').decode(buf);}catch(e){} }
  text=text.replace(/\r\n?/g,'\n');
  // 章节切分
  const re=/^[ \t]*(第[0-9一二三四五六七八九十百千万零两]+[章节卷回部篇][^\n]{0,40}|(?:Chapter|CHAPTER)\s+\d+[^\n]{0,40}|序章|序言|前言|楔子|尾声|后记)[ \t]*$/gm;
  const idxs=[]; let m;
  while((m=re.exec(text))!==null){ idxs.push({i:m.index,title:m[1].trim()}); if(idxs.length>2000)break; }
  const chs=[];
  if(idxs.length>=2){
    if(idxs[0].i>0) chs.push({title:'开篇', body:text.slice(0,idxs[0].i)});
    idxs.forEach((c,k)=>{ chs.push({title:c.title, body:text.slice(c.i, idxs[k+1]?idxs[k+1].i:undefined)}); });
  } else {
    const SIZE=12000;
    for(let i=0;i<text.length;i+=SIZE) chs.push({title:`第 ${Math.floor(i/SIZE)+1} 节`, body:text.slice(i,i+SIZE)});
    if(!chs.length) chs.push({title:'全文', body:text||'（空文件）'});
  }
  let acc=0; chs.forEach(c=>{c.startChar=acc; acc+=c.body.length;});
  cur._chs=chs; cur._totalChars=acc||1; cur.engine={destroy(){}};
  const p=progOf(cur.book.id);
  cur._ch=Math.min(chs.length-1,(p.loc&&p.loc.txt&&p.loc.txt.ch)||0);
  cur._pendRatio=(p.loc&&p.loc.txt&&p.loc.txt.ratio)||0;
  _loadReset();
  txtRebuildMode();
  _lt('first-paint');
  renderToc(chs.map((c,i)=>({label:c.title,ch:i,depth:0})), t=>{
    if(t.builtin){cur._ch=t.builtin.ch;cur._pendRatio=0;txtRebuildMode();}
    else{const pct=parseFloat(t.custom.target);if(!isNaN(pct))txtGotoGlobal(pct/100);else toast('目录位置无效');}
  });
}
function txtChapterHtml(ci){

  const paras=ch.body.split('\n').map(s=>s.trim()).filter(Boolean);
  const html=paras.map((p,pi)=>{
    let inner=esc(p);
    ms.forEach(mk=>{
      const segs=mk.loc.segs||(mk.loc.para!=null?[{para:mk.loc.para,from:mk.loc.from,to:mk.loc.to,text:mk.text}]:[]);
      segs.filter(s=>s.para===pi&&s.text).forEach(s=>{

}
function txtRepaint(){
  const scrolled=rset.flow==='scrolled';
  const el=scrolled?$('#txtBody'):$('#txtCols');
  if(!el)return;
  el.innerHTML=txtChapterHtml(cur._ch);
  el.querySelectorAll('mark[data-mk]').forEach(mk=>mk.onclick=()=>{const m=marksAll.find(x=>x.id===mk.dataset.mk);if(m)showNote(m);});
  bindTxtSelection(el);
  if(!scrolled){
    const pager=$('#txtPager');
    const W=pager.clientWidth-80+48;
    $('#txtCols').style.columnWidth=(pager.clientWidth-80)+'px';
    requestAnimationFrame(()=>{
      cur._pgW=W;
      cur._pgTotal=Math.max(1,Math.ceil(($('#txtCols').scrollWidth+48)/W));
      cur._pg=Math.min(cur._pgTotal-1, Math.round(cur._pendRatio*(cur._pgTotal-1)));
      txtShowPage();
    });
  } else txtProgressSave();
}
function txtRepaginate(){ if(cur&&cur.fmt==='txt')txtRepaint(); }
function txtShowPage(){
  $('#txtCols').style.transform=`translateX(${-cur._pg*cur._pgW}px)`;
  txtProgressSave();
}
function txtFlip(d){
  if(rset.flow==='scrolled'){const sc=$('#txtScroll');sc.scrollBy({top:d*sc.clientHeight*.9,behavior:'smooth'});return;}
  const np=cur._pg+d;
  if(np<0){ if(cur._ch>0){cur._ch--;cur._pendRatio=1;txtRepaint();} return; }
  if(np>=cur._pgTotal){ if(cur._ch<cur._chs.length-1){cur._ch++;cur._pendRatio=0;txtRepaint();} return; }
  cur._pg=np; txtShowPage();
}
function txtRatio(){
  if(rset.flow==='scrolled'){const sc=$('#txtScroll');return sc&&sc.scrollHeight>sc.clientHeight?sc.scrollTop/(sc.scrollHeight-sc.clientHeight):0;}
  return cur._pgTotal>1?cur._pg/(cur._pgTotal-1):0;
}
function txtGlobalPercent(){
  const ch=cur._chs[cur._ch];
  return Math.min(100,(ch.startChar+txtRatio()*ch.body.length)/cur._totalChars*100);
}
function txtProgressSave(){
  tocMarkByChapter(cur._ch);   /* 第十四批：目录一级标签的「当前章」实色高亮 */
  const percent=Math.round(txtGlobalPercent()*10)/10;
  const old=progMap[cur.book.id]||{loc:{}};
  saveProgress({percent, loc:{...(old.loc||{}),txt:{ch:cur._ch,ratio:txtRatio()}}});
}
function txtGotoGlobal(ratio){
  const target=ratio*cur._totalChars;
  let ci=cur._chs.findIndex(c=>target<c.startChar+c.body.length);
  if(ci<0)ci=cur._chs.length-1;
  cur._ch=ci;
  cur._pendRatio=Math.min(1,Math.max(0,(target-cur._chs[ci].startChar)/(cur._chs[ci].body.length||1)));
  if(rset.flow==='scrolled'){txtRepaint();const sc=$('#txtScroll');sc.scrollTop=cur._pendRatio*(sc.scrollHeight-sc.clientHeight);}
  else txtRepaint();
}
function txtJumpMark(m){
  if(m.type==='bookmark'&&m.loc&&typeof m.loc==='object'){cur._ch=Math.min(cur._chs.length-1,m.loc.ch||0);cur._pendRatio=m.loc.ratio||0;txtRebuildMode();return;}
  if(m.loc&&m.loc.ch!==undefined){
    cur._ch=Math.min(cur._chs.length-1,m.loc.ch);cur._pendRatio=0;txtRepaint();
    requestAnimationFrame(()=>{
      const el=document.querySelector(`mark[data-mk="${m.id}"]`);
      if(el&&rset.flow!=='scrolled'){
        const pg=Math.round(el.offsetLeft/cur._pgW);
        cur._pg=Math.min(cur._pgTotal-1,Math.max(0,pg));txtShowPage();
      } else if(el) el.scrollIntoView({block:'center'});
    });
  }
}
/* TXT 划选：监听 document 级 mouseup / touchend。
   之前只绑在正文容器上，桌面端拖选后松开鼠标常落在容器外（页边距、工具栏等），
   事件不触发 → 菜单永远弹不出来。document 级监听 + 校验选区锚点在正文段落内即可。 */
function bindTxtSelection(root){ /* 保留接口，实际逻辑已移至 document 级 */ }
function txtSelCheck(fx,fy){
  if(!cur||cur.fmt!=='txt')return;
  const sel=window.getSelection();
  if(!sel||sel.isCollapsed)return;
  const range=sel.getRangeAt(0);
  const fullText=sel.toString();
  if(!fullText.trim())return;
  /* 跨段落选区：逐段切分，记录每段字符偏移与文本，供高亮绘制 + 去重/合并比较 */
  const pEls=[...document.querySelectorAll('#txtBody p[data-para], #txtCols p[data-para]')];
  const segs=[];
  for(const pEl of pEls){
    if(!range.intersectsNode(pEl)) continue;
    const para=Number(pEl.dataset.para);
    let from=0, to=pEl.textContent.length;
    if(pEl.contains(range.startContainer)||pEl===range.startContainer){
      const pre=document.createRange(); pre.selectNodeContents(pEl); pre.setEnd(range.startContainer, range.startOffset);
      from=pre.toString().length;
    }
    if(pEl.contains(range.endContainer)||pEl===range.endContainer){
      const pre=document.createRange(); pre.selectNodeContents(pEl); pre.setEnd(range.endContainer, range.endOffset);
      to=pre.toString().length;
    }
    if(to<=from) continue;
    const segText=pEl.textContent.slice(from,to);
    if(!segText.trim()) continue;
    segs.push({para, from, to, text:segText});
  }
  if(!segs.length)return;
  const loc={ch:cur._ch, segs, para:segs[0].para, from:segs[0].from, to:segs[segs.length-1].to};
  let x=fx,y=fy;
  try{const r=range.getBoundingClientRect();if(r&&(r.width||r.height)){x=r.left+r.width/2;y=r.top;}}catch(e){}
  showSelMenu(x,y,{apply:async(kind,note)=>{
    await addMark({type:kind==='note'?'note':'highlight',loc,locText:'',text:fullText,note});
    try{sel.removeAllRanges();}catch(e){} txtRepaint();
  }});
}
document.addEventListener('mouseup',e=>{
  if(e.target.closest&&(e.target.closest('#selMenu')||e.target.closest('#noteDlg')))return;
  setTimeout(()=>{txtSelCheck(e.clientX,e.clientY);pdfSelCheck(e.clientX,e.clientY);},0);
});
document.addEventListener('touchend',e=>{
  if(e.target.closest&&(e.target.closest('#selMenu')||e.target.closest('#noteDlg')))return;
  setTimeout(()=>{txtSelCheck(innerWidth/2,90);pdfSelCheck(innerWidth/2,90);},250);
});
/* 手机长按选中的可靠信号是 selectionchange（touchend 时 DOM 选区往往尚未提交，
   安卓/iOS 长按后 getSelection 为空 → 菜单弹不出）。带防抖，避免拖动手柄时反复触发。 */
let pdfSelTimer=null;
document.addEventListener('selectionchange',()=>{
  if(!cur||cur.fmt!=='pdf')return;
  if($('#selMenu').style.display==='block')return;
  const sel=window.getSelection();
  if(!sel||sel.isCollapsed)return;
  if(!pdfSelPageOf(sel))return;
  if(pdfSelTimer)clearTimeout(pdfSelTimer);
  pdfSelTimer=setTimeout(()=>pdfSelCheck(innerWidth/2,90),350);
});
/* PDF 点击已有高亮/批注 → 查看批注；正在划选时忽略。
   用 document 委托，避免依赖 #pdfWrap 是否存在（脚本初始化时它还不存在）。 */
document.addEventListener('click',e=>{
  if(window.getSelection()&&window.getSelection().toString())return;
  const sp=e.target.closest?e.target.closest('.pdf-hl,.pdf-nt'):null;
  const mk=sp&&sp.dataset&&sp.dataset.mk;
  if(mk){ const m=marksAll.find(x=>x.id===mk); if(m) showNote(m); }
});

/* ============ CBZ 漫画 ============ */
async function cbzOpen(){
  _loadStage('正在解压漫画…');
  const zip=await JSZip.loadAsync(cur.file.blob);
  const names=Object.keys(zip.files).filter(n=>!zip.files[n].dir&&/\.(jpe?g|png|gif|webp)$/i.test(n))
    .sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  if(!names.length){_loadReset();$('#rdView').innerHTML='<div class="center-msg">压缩包内没有图片</div>';return;}
  cur._zip=zip; cur._names=names; cur._total=names.length; cur._urls={};
  cur.engine={destroy(){Object.values(cur._urls||{}).forEach(u=>URL.revokeObjectURL(u));}};
  const p=progOf(cur.book.id);
  cur._page=Math.min(cur._total,Math.max(1,(p.loc&&p.loc.cbz)||1));
  _loadReset();
  $('#rdView').innerHTML='<div id="cbzWrap"></div>';
  renderToc([], t=>{ if(t.custom){const pg=parseInt(t.custom.target);if(pg)cbzGoto(pg);} });
  await cbzRender();
  _lt('first-paint');
}
async function cbzUrl(i){
  if(cur._urls[i])return cur._urls[i];
  const n=cur._names[i];
  const blob=new Blob([await cur._zip.file(n).async('arraybuffer')],{type:guessMime(n)});
  return cur._urls[i]=URL.createObjectURL(blob);
}
async function cbzRender(){
  const wrap=$('#cbzWrap'); if(!wrap)return;
  wrap.innerHTML='';
  const idxs=rset.spread==='none'?[cur._page-1]:[cur._page-1,cur._page].filter(i=>i<cur._total);
  for(const i of idxs){
    const img=new Image(); img.className=idxs.length===1?'single':'';
    img.src=await cbzUrl(i); wrap.appendChild(img);
  }
  tocMarkByPage(cur._page);    /* 第十四批：目录「当前章」实色高亮（CBZ 目录项带目标页码） */
  const percent=Math.round(cur._page/cur._total*1000)/10;
  const old=progMap[cur.book.id]||{loc:{}};
  saveProgress({percent, loc:{...(old.loc||{}),cbz:cur._page}});
}
function cbzGoto(p){ if(!cur||!cur._names)return; cur._page=Math.min(cur._total,Math.max(1,p)); cbzRender(); }

/* ============ 不支持在线阅读的格式 ============ */
function unsupportedOpen(){
  const f=cur.file;
  cur.engine={destroy(){}};
  _loadReset();
  const url=URL.createObjectURL(f.blob);
  $('#rdView').innerHTML=`<div class="center-msg">
    <div style="font-size:16px;color:var(--fg)">${f.format.toUpperCase()} 格式暂不支持在浏览器中直接阅读</div>
    <div>建议在管理页为本书补充 EPUB / PDF / TXT 版本，即可在线阅读；<br>也可下载该文件用本地阅读软件打开。</div>
    <a href="${url}" download="${esc(f.name)}"><button class="primary">下载 ${esc(f.name)}</button></a>
  </div>`;
  renderToc([],()=>{});
}

/* ============ 同步与启动 ============ */
/* 静态站标记：管理端构建时注入 <head>。静态站是只读镜像、没有 /api/* 端点，
   而 shared.js 的 SyncClient 在 http(s) 下会按同源自动启用同步（那是给 sync-server
   托管场景留的路子）—— 于是每个访客开场都会打一次 /api/pull，随后还挂着 20 秒轮询与
   focus 拉取，既抢首屏带宽又刷一屏 404。这里同步读标记，直接不启动它。
   非站点场合（读者端.html 走 http 由 sync-server 托管）行为完全不变。 */
/* 与上面 STATIC_SITE_MARK 同源同义：探测只在上文做一次（启动期 probeSite 用到它，
   不能等到文件尾部才定义），这里取别名给下面的同步开关用，避免同一判断写两遍。 */
const STATIC_SITE = STATIC_SITE_MARK;
onRemoteChange(()=>{ if(!cur) loadAll(); });
window.__refresh = () => { if(!cur) loadAll(); };
window.addEventListener('resize',()=>{ if(!cur)return; if(cur.fmt==='pdf')pdfRender(); else if(cur.fmt==='txt'&&rset.flow!=='scrolled')txtRepaint(); else if(cur.fmt==='cbz')cbzRender(); });
/* 2026-09-25（第十批）：这里原本还有一句「恢复分类折叠区状态」的调用 —— 侧栏删除后那个函数
   已不存在，调用一并删除（⚠️ 删函数必须连调用点一起删：留一句顶层调用会在 boot 期抛
   ReferenceError，把后面整段启动流程（含 loadAll()）全部掐断，书库永远是空的）。 */
/* 需求1 欢迎页：开站先显示；两个入口都先撤下欢迎页再动作。
   「随机一本」从**全部**藏书里随机挑一本进详情屏（不受书架筛选影响）；空库给提示而不是静默无反应。 */
(function(){
  const w=$('#rdWelcome'); if(!w) return;
  const go=()=>w.classList.add('off');
  const enter=$('#wcEnter'), rnd=$('#wcRandom');
  /* 2026-10-08 加载慢专项：欢迎页是**刻意在 loadAll() 之前**显示的（让访客立刻看到东西），
     于是它天然有一段空窗期 —— 书目还没到就点，「进入书库」看到的是空白书架、
     「随机一本」直接弹「书库还是空的」。用户报的「按钮要点两次才有反应」正是第一次点落在这段
     空窗里（第二次点的时候书已经到了，于是像是「点两次才生效」）。
     现在点下去若书目未就绪：按钮变「载入中…」并等首屏那次 loadAll（上限 20 秒），
     就绪后接着做完动作 —— 不再静默、也不再误报空库。 */
  /* ⚠️ 等的是 _booksReadyP（书目就绪），**不是** window.__shelfP（整个 loadAll）。
     loadAll 含封面回填：在慢托管上封面要几十秒，而书目早就可交互了 —— 拿它当判据必然超时，
     表现就是「有时能进、有时点了没反应」（取决于那次封面快不快）。 */
  const waitBooks = ()=>{
    if(typeof books!=='undefined' && books.length) return Promise.resolve(true);
    return Promise.race([
      _booksReadyP.then(()=>true, ()=>true),
      new Promise(r=>setTimeout(()=>r(false), 20000)),
    ]).then(()=> !!(typeof books!=='undefined' && books.length));
  };
  /* 未就绪时给**能 actionable** 的提示，且**不撤欢迎页** —— 否则露出空白书架，
     用户只会认为「点了没反应」，根本猜不到是书目还没到。 */
  const tipNoBooks = ()=> _siteNoSrc
    ? '书目没能载入：静态站的 manifest.json / manifest.js 没取到，请确认它们随目录一起上传了'
    : '书目还在载入，请稍后再点一次';
  const busy=(btn,on)=>{
    if(!btn) return;
    if(on){ if(!btn.dataset.busy){ btn.dataset.busy='1'; btn.dataset.t=btn.textContent; btn.disabled=true; btn.textContent='载入中…'; } }
    else if(btn.dataset.busy){ delete btn.dataset.busy; btn.disabled=false; btn.textContent=btn.dataset.t||btn.textContent; }
  };
  /* 两个入口都用 try/finally 收尾：waitBooks 万一抛错（不该发生，但这是首屏唯一的交互出口），
     按钮也必须恢复可点 —— 卡在 disabled + 「载入中…」就是用户说的「永远没反应」。 */
  if(enter) enter.onclick=async ()=>{
    busy(enter,true);
    let ready=false;
    try{ ready = await waitBooks(); }catch(e){ console.warn('waitBooks', e); }finally{ busy(enter,false); }
    if(!ready){ toast(tipNoBooks()); return; }
    go();
  };
  if(rnd) rnd.onclick=async ()=>{
    busy(rnd,true);
    let ready=false;
    try{ ready = await waitBooks(); }catch(e){ console.warn('waitBooks', e); }finally{ busy(rnd,false); }
    if(!ready){ toast(tipNoBooks()); return; }
    const b=books[Math.floor(Math.random()*books.length)];
    go();
    openBook(b.id,{random:true});   /* 第十八批⑨：random ⇒ 详情顶栏亮出「随机一本」重抽按钮 */
  };
})();
/* 2026-09-27（第十八批④）内嵌寒蝉半圆体**启动即预载**（不 await，与 loadAll 并行）：
   UI 字族 `--mm-ff-round` 的栈是「本机 ChillRoundM / 寒蝉半圆体 → 内嵌 RDChillRound → 黑体兜底」。
   开发机装了本机字体，前两项命中 ⇒ 一直看不出问题；但**其它设备没有本机字体**，必须靠内嵌那一族。
   而 ensureChillFont() 原本只在「下滑进正文」「开书」「手动切到寒蝉档」三处被调用 ⇒
   欢迎页 / 主页 / 图书详情页这**三个阶段内嵌家族根本没注册**，一路掉到黑体栈 —— 用户报的就是这个。
   ⚠️ 这里**无条件**预载，不加 `rset.ff==='chill'` 门槛（那是 chillArm 的判据）：UI 字族与阅读区
   字体档无关 —— 用户把阅读区切成「系统宋体」时，主页 / 详情 / 欢迎页用的仍是寒蝉半圆体。
   副作用只有好的一面：预载后 `_chillUrl` 早已就绪，EPUB 首次渲染 ffEmbedCss() 就能带上真实
   @font-face 源，不必等章节渲染完再补注一次（原来那一帧正文也会闪黑体）。 */
/* 第十八批⑦：欢迎页星星贴纸的点击放大（两颗、左上蓝 / 右下粉）。
   挂**委托**在 #rdWelcome 上（静态 DOM 一定在），不逐个按钮绑。
   ① 只切 .pop：放大与回正全在 CSS 里（`#rdWelcome .wc-star.pop{transform:rotate(0) scale(1.35)}`），
      JS 不碰内联样式 —— 免得和 reduce-motion 档的 transform 打架。
   ② stopPropagation：欢迎页的两个入口会先撤欢迎页再动作，星星**不是入口**，点它不能把页撤掉。
   ③ 一次只放一颗（点第二颗时把前一颗复位），观感上更像「戳一下亮一下」。 */
(function(){
  var w=document.getElementById('rdWelcome');
  if(!w) return;
  w.addEventListener('click',function(e){
    var s=e.target.closest && e.target.closest('.wc-star');
    if(!s) return;
    e.stopPropagation();
    var on=s.classList.contains('pop');
    Array.prototype.forEach.call(w.querySelectorAll('.wc-star.pop'),function(x){ x.classList.remove('pop'); });
    if(!on) s.classList.add('pop');
  });
})();
ensureChillFont();
/* 首屏这次 loadAll 的句柄留给欢迎页两个入口（见 wcEnter / wcRandom 的 waitBooks）：
   它们要在书目真正就绪后才动作，否则第一次点击会落在空窗里（「要点两次才有反应」）。 */
/* ⚠️ 必须 catch：loadAll 若因任何原因抛错（probeSite 里没有 try 包裹的分支、IDB 被禁…），
   不接住就会让 __booksP 永不 resolve ⇒ waitBooks 干等满 20 秒才给反馈。
   接住后立刻 booksReady(false)，欢迎页两个入口马上能提示并恢复可点，不必空等。 */
window.__shelfP = loadAll().catch(e=>{ console.warn('loadAll', e); booksReady(false); });
if(!STATIC_SITE) SyncClient.init();
</script>
</body>
</html>
